<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opening Room w2281...</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 100vh; margin: 0;
    background: #f7f7f7; text-align: center; padding: 24px;
    box-sizing: border-box;
  }
  h1 { font-size: 1.25rem; color: #1a1a1a; margin-bottom: 8px; }
  p { color: #555; font-size: 0.95rem; margin: 4px 0 24px; }
  a.btn {
    display: inline-block; background: #0071ce; color: #fff;
    text-decoration: none; font-weight: 700; padding: 16px 32px;
    border-radius: 12px; font-size: 1rem; margin-bottom: 16px;
  }
  a.fallback { color: #0071ce; font-size: 0.85rem; }
</style>
</head>
<body>
  <h1 id="heading">Opening Room w2281&hellip;</h1>
  <p>If nothing happens, tap the button below.</p>
  <a class="btn" id="launch-btn" href="https://ai-innovation-lab-app-ebbdbdbfaecdbeba.walmart.com/room/w2281">Open Room w2281</a>
  <a class="fallback" href="https://ai-innovation-lab-app-ebbdbdbfaecdbeba.walmart.com/room/w2281">Having trouble? Open normally instead</a>
  <script>
    // Force the corporate-tunnel browser based on platform, since
    // BYOD devices route Walmart apps through different apps per OS:
    //   iOS     -> Microsoft Edge     (microsoft-edge-https:// scheme)
    //   Android -> "Web" app          (intent:// URI, package-targeted)
    // Anything else (desktop, etc.) just uses the plain https:// link
    // already set as the default href above.
    (function () {
      var ua = navigator.userAgent || "";
      var isIOS = /iPhone|iPad|iPod/.test(ua);
      var isAndroid = /Android/.test(ua);
      var heading = document.getElementById("heading");
      var btn = document.getElementById("launch-btn");
      var targetUrl = null;

      if (isIOS) {
        targetUrl = "microsoft-edge-https://ai-innovation-lab-app-ebbdbdbfaecdbeba.walmart.com/room/w2281";
        heading.textContent = "Opening Room w2281 in Microsoft Edge\u2026";
        btn.textContent = "Open in Microsoft Edge";
      } else if (isAndroid) {
        targetUrl = "intent://ai-innovation-lab-app-ebbdbdbfaecdbeba.walmart.com/room/w2281#Intent;scheme=https;package=com.vmware.browser;S.browser_fallback_url=https%3A%2F%2Fai-innovation-lab-app-ebbdbdbfaecdbeba.walmart.com%2Froom%2Fw2281;end;";
        heading.textContent = "Opening Room w2281 in Web\u2026";
        btn.textContent = "Open in Web";
      }

      if (targetUrl) {
        btn.href = targetUrl;
        // Some mobile browsers block scheme/intent navigation without
        // a user gesture -- this covers the ones that allow it
        // automatically; the button covers the ones that don't.
        window.location.href = targetUrl;
      }
    })();
  </script>
</body>
</html>
